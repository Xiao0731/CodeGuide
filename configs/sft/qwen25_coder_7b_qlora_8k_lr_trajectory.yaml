schema_version: codeguide-sft-training-v1
mode: full
seed: 20260728
data_seed: 20260728

model:
  model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
  tokenizer_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
  cache_dir: null
  trust_remote_code: false
  max_seq_length: 8192
  expected_canonical_sha256: 08ef448f4be6b6b34ee2b6b7af5748827feeba0a0f36cc393350374671c86a1b
  attention_backend: auto

data:
  canonical: data/final/sft_accepted.jsonl
  train_ids: data/splits/sft_train_ids.json
  dev_ids: data/splits/sft_dev_ids.json
  calibration_ids: data/splits/sft_calibration_500_ids.json
  calibration_eval_size: 100
  expected_train_count: 9791
  expected_dev_count: 515
  packing: false
  group_by_length: true

qlora:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
  r: 32
  alpha: 64
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  # 两个学习率实验分别占用一张 4090。单进程 gradient accumulation=16，
  # 与原双卡训练的全局有效 batch 1×8×2=16 保持一致，因此仍约 612 steps。
  output_dir: outputs/sft/qwen25_coder_7b_qlora_8k/lr_trajectory_default
  expected_world_size: 1
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  optimizer: paged_adamw_8bit
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  use_liger_kernel: true
  liger_kernel_config:
    fused_linear_cross_entropy: true
  logging_steps: 1
  eval_steps: 25

  # 禁止普通周期保存。真正保存由 checkpoint_milestones callback 触发。
  # 1e-4 的能力变化更缓，因此在 200--400 step 区间补充 250/350；
  # 两组学习率使用完全相同的里程碑，保证逐点可比。
  save_steps: 1000000
  save_total_limit: 20
  checkpoint_milestones: [5, 10, 20, 30, 40, 50, 75, 100, 150, 200, 250, 300, 350, 400, 500, 600, 612]

  dataloader_num_workers: 2
  ddp_find_unused_parameters: false
  report_to: none
